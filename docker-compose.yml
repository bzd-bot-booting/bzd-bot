services:
  postgres:
    image: postgres:16-alpine
    container_name: bzhd-postgres
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bzhd_bot}
      POSTGRES_USER: ${POSTGRES_USER:-bzhd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Europe/Vilnius}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: bzhdbot/bzhd-bot:latest
    pull_policy: missing
    container_name: bzhd-bot
    network_mode: host
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SERVICE_NAME: bzhd_bot
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /var/log/bzhd_bot/app.json.log
      HEALTH_FILE: /tmp/bzhd_bot_heartbeat
      TZ: ${TZ:-Europe/Vilnius}
    volumes:
      - bot_logs:/var/log/bzhd_bot
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time,sys; p='/tmp/bzhd_bot_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<100 else 1)"
      interval: 45s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
  bot_logs:

networks:
  backend:
    driver: bridge
